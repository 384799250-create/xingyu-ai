<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星屿 · 资料保留与恢复</title><link rel="stylesheet" href="operating.css"><body><main><a href="/ai/account/">返回账号</a><p class="eyebrow">星屿 AI</p><h1>资料保留与恢复</h1><p>你的原应用已回到应用池，个人资料仍单独保留。补足欠额且余额大于 0 后，将自动分配应用并恢复资料；原网站账号继续使用。</p><section aria-labelledby="balance-title"><h2 id="balance-title">星币余额</h2><p id="balance">正在读取…</p><p id="deadline"></p><p>每日运营费为 <strong>300 星币</strong>，优先使用当天活动星币。暂停期间不继续扣费。连续暂停第 7 天回收应用，第 15 天清理资料并注销账号，财务记录留存。</p><button id="claim" disabled>领取今日 1000 活动星币</button><button id="refresh">刷新恢复状态</button></section><section><h2>充值星币</h2><p>新用户一次性赠送 1000 长久星币，每日活动星币仍可单独领取。充值先补足运营费欠额。</p><label for="tier">充值金额</label><select id="tier"><option>正在读取支付方式…</option></select><div class="payments"><button id="alipay" disabled>支付宝支付</button><button id="wechat" disabled>微信扫码支付</button></div><p>支付结果以订单查询和到账记录为准；付款后请保留原订单，避免重复付款。微信二维码请用另一台设备扫码。</p><div id="order" hidden><p id="order-text"></p><a id="checkout" target="_blank" rel="noopener noreferrer" hidden>前往支付宝付款</a><img id="qr" alt="微信支付二维码" hidden><button id="query">查询订单是否到账</button></div></section><p id="feedback" role="status" aria-live="polite"></p></main><script src="operating.js"></script></body></html>
